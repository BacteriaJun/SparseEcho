[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sparseecho-sfpti"
version = "1.0"
description = "Hardware-neutral reconstruction of sparse time-varying modulated scatterer fields using Spectrally Factorized Physical-Time Inversion."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "SparseEcho Contributors"}]
keywords = ["signal-processing", "walsh-hadamard", "sparse-recovery", "complex-baseband", "inverse-problems"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sparseecho = "sparseecho.cli:main"

[tool.setuptools.packages.find]
include = ["sparseecho*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
